<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>
            Mulg
        </title>
        <link rel="stylesheet" href="style.css" type="text/css" />
    </head>
    <body>
        <div id="game">
            <div id="hud">
                <span class="hud_item">Level <b id="hud_level"></b></span>
                <span class="hud_item">Time <b id="hud_time"></b></span>
                <span class="hud_item">Score <b id="hud_score"></b></span>
                <span class="hud_item">Lives <b id="hud_lives"></b></span>
            </div>
            <!-- http://stackoverflow.com/questions/10487292/position-absolute-but-relative-to-parent -->
            <div id="board"></div>
            <p id="message"></p>
            <div id="notes">
                <p id="note"></p>
                <button id="notes_toggle" type="button">Notes</button>
                <ul id="notes_list"></ul>
            </div>
            <p id="help">Arrow keys to tilt, R to restart the level.</p>
        </div>
        <script src="build.js"></script>
    </body>
</html>
